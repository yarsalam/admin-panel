name: yarsalam-admin-prod-20261026

services:
  admin-web:
    image: ghcr.io/yarsalam/admin-panel-web:${ADMIN_WEB_IMAGE_TAG:?Set ADMIN_WEB_IMAGE_TAG to an immutable GHCR tag}
    restart: unless-stopped
    # Do not use env_file: .env here. That file also contains backend/database
    # credentials; the web runtime needs only this explicit public API setting.
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?Set NEXT_PUBLIC_API_URL to the production API URL}
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/login').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
