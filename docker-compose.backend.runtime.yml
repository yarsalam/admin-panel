name: yarsalam-admin-prod-20261026

services:
  admin-backend:
    image: ghcr.io/yarsalam/admin-panel-backend:${ADMIN_BACKEND_IMAGE_TAG:?Set ADMIN_BACKEND_IMAGE_TAG to an immutable GHCR tag}
    restart: unless-stopped
    ports:
      - "127.0.0.1:4000:4000"
    environment:
      NODE_ENV: production
      PORT: "4000"
      DB_SYNC: "false"
      ADMIN_WEB_ORIGINS: ${ADMIN_WEB_ORIGINS:?Set ADMIN_WEB_ORIGINS in the private admin .env}
      DB_HOST: admin-mysql
      DB_PORT: "3306"
      DB_USER: ${ADMIN_DB_USER:-admin_app}
      DB_PASS: ${ADMIN_DB_PASSWORD:?Set ADMIN_DB_PASSWORD in the private admin .env}
      DB_NAME: admin_yarsalam
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the private admin .env}
      REDIS_HOST: admin-redis
      REDIS_PORT: "6379"
      USER_API_BASE_URL: ${USER_API_BASE_URL:-http://backend:5000}
      USER_API_KEY: ${USER_API_KEY:?Set USER_API_KEY in the private admin .env}
      AI_PACK_CONTROL_URL: ${AI_PACK_CONTROL_URL:?Set AI_PACK_CONTROL_URL in the private admin .env}
      AI_PACK_CONTROL_TOKEN: ${AI_PACK_CONTROL_TOKEN:?Set AI_PACK_CONTROL_TOKEN in the private admin .env}
      NODE_OPTIONS: --max-old-space-size=640
    mem_limit: 768m
    cpus: 0.75
    networks:
      shared_network:
        aliases:
          - admin-backend
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4000/infrastructure/ai-packs/status').then(r => process.exit([401,403].includes(r.status) ? 0 : 1)).catch(() => process.exit(1))"
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 45s

networks:
  shared_network:
    external: true
    name: yarsalam_network
