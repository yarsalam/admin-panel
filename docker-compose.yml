networks:
  shared_network:
    external: true
    name: yarsalam_network

services:
  admin-redis:
    image: redis:7-alpine
    container_name: admin_redis
    restart: unless-stopped
    ports:
      - "6381:6379"
    networks:
      - shared_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  admin-mysql:
    image: mysql:8.0
    container_name: admin_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${ADMIN_DB_ROOT_PASSWORD:?Set ADMIN_DB_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: admin_yarsalam
      MYSQL_USER: ${ADMIN_DB_USER:-admin_app}
      MYSQL_PASSWORD: ${ADMIN_DB_PASSWORD:?Set ADMIN_DB_PASSWORD in .env}
    ports:
      - "5530:3306"
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - shared_network

  admin-backend:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    ports:
      - "${PORT:-4000}:${PORT:-4000}"
    volumes:
      - ./apps/server:/app/apps/server
      - backend_node_modules:/app/apps/server/node_modules
    command: pnpm run start:dev
    environment:
      DB_HOST: admin-mysql
      DB_PORT: 3306
      DB_USER: ${ADMIN_DB_USER:-admin_app}
      DB_PASS: ${ADMIN_DB_PASSWORD:?Set ADMIN_DB_PASSWORD in .env}
      DB_NAME: admin_yarsalam
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${PORT:-4000}
      ADMIN_WEB_ORIGINS: ${ADMIN_WEB_ORIGINS:-http://localhost:3000,http://192.168.0.133:3000}
      DB_SYNC: ${DB_SYNC:-true}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-}
      REDIS_HOST: admin-redis
      REDIS_PORT: 6379
      USER_API_BASE_URL: ${USER_API_BASE_URL:-http://backend:5000}
      USER_API_KEY: ${USER_API_KEY:?Set USER_API_KEY to match mobApp INTERNAL_API_KEY}
    depends_on:
      admin-mysql:
        condition: service_healthy
      admin-redis:
        condition: service_healthy
    networks:
      - shared_network

  admin-web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    volumes:
      - ./apps/web:/app/apps/web
      - frontend_node_modules:/app/apps/web/node_modules
    command: pnpm run dev
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    depends_on:
      - admin-backend
    networks:
      - shared_network

volumes:
  backend_node_modules:
  frontend_node_modules: