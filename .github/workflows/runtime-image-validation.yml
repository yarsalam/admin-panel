name: Admin web runtime image validation

on:
  pull_request:
    paths:
      - ".dockerignore"
      - "apps/web/**"
      - "apps/server/package.json"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - "docker-compose.runtime.yml"
      - ".github/workflows/runtime-image-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate runtime Compose and environment isolation
        shell: bash
        run: |
          set -euo pipefail
          env_file="$(mktemp)"
          config_file="$(mktemp)"
          cleanup() { rm -f "$env_file" "$config_file"; }
          trap cleanup EXIT
          chmod 600 "$env_file" "$config_file"
          cat > "$env_file" <<'ENV'
          ADMIN_WEB_IMAGE_TAG=sha-ci-validation
          NEXT_PUBLIC_API_URL=https://ci.invalid/api
          ENV
          docker compose --project-directory "$PWD" --env-file "$env_file" \
            -f docker-compose.runtime.yml config --format json > "$config_file"
          python - "$config_file" <<'PY'
          import json
          import sys
          from pathlib import Path

          config = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          if config.get("name") != "yarsalam-admin-prod-20261026":
              raise SystemExit("unexpected Compose project name")
          services = config.get("services", {})
          if set(services) != {"admin-web"}:
              raise SystemExit("runtime Compose must contain only admin-web")
          service = services["admin-web"]
          if service.get("build"):
              raise SystemExit("runtime Compose must not define a build context")
          if service.get("env_file"):
              raise SystemExit("runtime web container must not inherit the private .env file")
          env = service.get("environment", {})
          allowed = {"NODE_ENV", "PORT", "HOSTNAME", "NEXT_TELEMETRY_DISABLED", "NEXT_PUBLIC_API_URL"}
          if set(env) != allowed:
              raise SystemExit(f"unexpected web environment keys: {sorted(set(env) ^ allowed)}")
          ports = service.get("ports", [])
          if not any(p.get("published") == "3000" and p.get("target") == 3000 and p.get("host_ip") == "127.0.0.1" for p in ports):
              raise SystemExit("admin-web must bind only to 127.0.0.1:3000")
          networks = service.get("networks", {})
          shared = networks.get("shared_network", {})
          if "admin-web" not in shared.get("aliases", []):
              raise SystemExit("admin-web must have the admin-web alias on shared_network")
          external = config.get("networks", {}).get("shared_network", {})
          if not external.get("external") or external.get("name") != "yarsalam_network":
              raise SystemExit("shared_network must reuse the external yarsalam_network")
          if "default" in config.get("networks", {}):
              raise SystemExit("runtime Compose must not create a separate default network")
          print("Runtime Compose guard passed: single service, no build/private env_file, loopback-only, attached to shared yarsalam_network with admin-web alias.")
          PY

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build standalone runtime image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile.production
          load: true
          push: false
          tags: admin-panel-web:ci-${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_URL=https://ci.invalid
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify runtime server and login route
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name admin-panel-web-ci -p 127.0.0.1:3030:3000 admin-panel-web:ci-${GITHUB_SHA}
          cleanup() { docker rm -f admin-panel-web-ci >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          for attempt in $(seq 1 45); do
            if curl --silent --show-error --fail http://127.0.0.1:3030/login >/dev/null; then
              echo "Standalone admin web /login returned HTTP 200"
              exit 0
            fi
            sleep 2
          done
          docker logs admin-panel-web-ci
          exit 1

      - name: Assert runtime image has no repository metadata or docs
        run: |
          docker run --rm --entrypoint sh admin-panel-web:ci-${GITHUB_SHA} -ec '
            test -f /app/apps/web/server.js
            test -d /app/apps/web/.next
            test ! -e /app/.git
            test ! -e /app/.github
            test ! -e /app/docs
          '
