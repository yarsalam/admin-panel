name: Admin web runtime image validation

on:
  pull_request:
    branches: [main]
    paths:
      - ".dockerignore"
      - "apps/web/**"
      - "apps/server/package.json"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - ".npmrc"
      - ".github/workflows/runtime-image-validation.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Regenerate and commit the patched pnpm lockfile
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Resolve patched workspace dependencies
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@9.0.0 --activate
          pnpm install --lockfile-only --no-frozen-lockfile
          if ! git diff --quiet -- pnpm-lock.yaml; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add pnpm-lock.yaml
            git commit -m "fix(security): refresh patched workspace lockfile"
            git push origin "HEAD:${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build standalone runtime image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile.production
          load: true
          push: false
          tags: admin-panel-web:ci-${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.yarsalam.top
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan admin runtime image for CRITICAL/HIGH vulnerabilities
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${RUNNER_TEMP}/trivy-cache:/root/.cache/" \
            aquasec/trivy:0.59.1 image \
            --exit-code 1 \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            "admin-panel-web:ci-${GITHUB_SHA}"

      - name: Verify runtime server and login route
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name admin-panel-web-ci -p 127.0.0.1:3030:3000 admin-panel-web:ci-${GITHUB_SHA}
          cleanup() { docker rm -f admin-panel-web-ci >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          for attempt in $(seq 1 45); do
            if curl --silent --show-error --fail http://127.0.0.1:3030/login >/dev/null; then
              echo "Standalone admin web /login returned HTTP 200"
              exit 0
            fi
            sleep 2
          done
          docker logs admin-panel-web-ci
          exit 1

      - name: Assert runtime image excludes repository metadata and documentation
        run: |
          docker run --rm --entrypoint sh admin-panel-web:ci-${GITHUB_SHA} -ec '
            test -f /app/apps/web/server.js
            test -d /app/apps/web/.next
            test ! -e /app/.git
            test ! -e /app/.github
            test ! -e /app/docs
          '

      - name: Export scanned private admin image candidate
        if: success()
        run: |
          docker save "admin-panel-web:ci-${GITHUB_SHA}" | gzip -1 > admin-panel-web-image.tar.gz
          sha256sum admin-panel-web-image.tar.gz > admin-panel-web-image.tar.gz.sha256
          echo "${GITHUB_SHA}" > admin-panel-web-image.source-commit.txt

      - name: Upload scanned private admin image candidate
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: yarsalam-admin-web-runtime-image-candidate
          path: |
            admin-panel-web-image.tar.gz
            admin-panel-web-image.tar.gz.sha256
            admin-panel-web-image.source-commit.txt
          retention-days: 14
          if-no-files-found: error

