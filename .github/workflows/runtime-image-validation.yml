name: Admin panel PR validation

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/server/**"
      - "apps/web/**"
      - "packages/**"
      - ".github/workflows/runtime-image-validation.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile --registry=https://registry.npmjs.org --replace-registry-host=always

      - name: Build admin API server
        run: pnpm --filter server build

      - name: Validate admin web types
        run: pnpm --filter web check-types

      - name: Lint admin web
        run: pnpm --filter web lint

      - name: Build admin web
        env:
          NEXT_PUBLIC_API_URL: https://api.yarsalam.top
        run: pnpm --filter web build
