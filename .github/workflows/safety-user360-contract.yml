name: Safety User 360 Contract

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/server/src/safety/services/user-detail.service.ts"
      - "apps/server/src/safety/services/user-detail.service.spec.ts safety/services/users.service.spec.ts"
      - "apps/web/app/(admin)/safety/users/**"
      - "apps/web/components/safety/PartialDataWarning.tsx"
      - "apps/web/package.json"
      - "apps/server/package.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/safety-user360-contract.yml"

permissions:
  contents: read

jobs:
  user360-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Install workspace dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Run User 360 partial-failure tests
        run: pnpm --filter server test -- --runInBand safety/services/user-detail.service.spec.ts
      - name: Build admin server
        run: pnpm --filter server build
      - name: Type-check admin web
        run: pnpm --filter web check-types
