name: Publish admin backend runtime image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-admin-backend-runtime
  cancel-in-progress: false

jobs:
  build-smoke-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build backend runtime image (no push yet)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/server/Dockerfile.production
          load: true
          push: false
          tags: ghcr.io/yarsalam/admin-panel-backend:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/yarsalam/admin-panel
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Verify compiled NestJS runtime and dependencies
        run: |
          set -euo pipefail
          docker run --rm --entrypoint sh ghcr.io/yarsalam/admin-panel-backend:sha-$GITHUB_SHA -ec '
            test -f /app/apps/server/dist/main.js
            node -e "require.resolve(\"@nestjs/core\"); require.resolve(\"@nestjs/axios\"); require.resolve(\"typeorm\")"
          '
      - name: Publish immutable image
        run: docker push ghcr.io/yarsalam/admin-panel-backend:sha-$GITHUB_SHA
      - name: Deployment summary
        run: |
          echo "Image: ghcr.io/yarsalam/admin-panel-backend:sha-$GITHUB_SHA"
          echo "Only an immutable runtime image was published; VPS was not changed."
