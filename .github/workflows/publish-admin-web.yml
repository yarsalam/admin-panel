name: Publish admin web runtime image

on:
  workflow_dispatch:
    inputs:
      next_public_api_url:
        description: "Exact production NEXT_PUBLIC_API_URL used by the current admin frontend"
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-admin-web-runtime
  cancel-in-progress: false

jobs:
  build-smoke-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout selected admin-panel ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Validate production API URL
        env:
          API_URL: ${{ inputs.next_public_api_url }}
        run: |
          python - <<'PY'
          import os
          from urllib.parse import urlparse
          value = os.environ["API_URL"].strip()
          parsed = urlparse(value)
          if parsed.scheme != "https" or not parsed.netloc:
              raise SystemExit("NEXT_PUBLIC_API_URL must be an absolute HTTPS URL")
          print("Production API URL format: valid")
          PY

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build standalone image (do not push yet)
        env:
          API_URL: ${{ inputs.next_public_api_url }}
          IMAGE_TAG: sha-${{ github.sha }}
        run: |
          set -euo pipefail
          docker buildx build \
            --platform linux/amd64 \
            --file apps/web/Dockerfile.production \
            --build-arg "NEXT_PUBLIC_API_URL=${API_URL}" \
            --label "org.opencontainers.image.source=https://github.com/yarsalam/admin-panel" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --tag "ghcr.io/yarsalam/admin-panel-web:${IMAGE_TAG}" \
            --load .

      - name: Verify runtime server and login route before publish
        env:
          IMAGE_TAG: sha-${{ github.sha }}
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/yarsalam/admin-panel-web:${IMAGE_TAG}"
          docker run -d --name admin-panel-web-publish-check -p 127.0.0.1:3030:3000 "${IMAGE}"
          cleanup() { docker rm -f admin-panel-web-publish-check >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          for attempt in $(seq 1 45); do
            if curl --silent --show-error --fail http://127.0.0.1:3030/login >/dev/null; then
              echo "Standalone admin web /login returned HTTP 200"
              exit 0
            fi
            sleep 2
          done
          docker logs admin-panel-web-publish-check
          exit 1

      - name: Publish immutable image tag
        env:
          IMAGE_TAG: sha-${{ github.sha }}
        run: docker push "ghcr.io/yarsalam/admin-panel-web:${IMAGE_TAG}"

      - name: Print deployment details
        run: |
          echo "Image: ghcr.io/yarsalam/admin-panel-web:sha-${GITHUB_SHA}"
          echo "Runtime: standalone, no repository checkout or source bind mount"
          echo "No VPS resources were changed."
