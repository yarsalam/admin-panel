name: Safety Tickets Contract

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/server/src/safety/services/tickets.service.ts"
      - "apps/server/src/safety/services/tickets.service.spec.ts"
      - "apps/web/app/(admin)/safety/tickets/page.tsx"
      - "apps/server/package.json"
      - "apps/server/tsconfig.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/safety-tickets-contract.yml"

permissions:
  contents: read

jobs:
  tickets-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Install workspace dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Run TicketsService error propagation tests
        run: pnpm --filter server test -- --runInBand safety/services/tickets.service.spec.ts
      - name: Build admin server
        run: pnpm --filter server build
