name: Admin Production Stack Smoke

on:
  pull_request:
    branches: [main]
    paths:
      - ".env.production.example"
      - "docker-compose.production.yml"
      - "apps/server/Dockerfile.production"
      - "apps/server/src/**"
      - "apps/server/package.json"
      - "apps/web/Dockerfile.production"
      - "apps/web/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/admin-production-stack-smoke.yml"

  push:
    branches: [chore/admin-vps-production-readiness-v2]

permissions:
  contents: read

jobs:
  production-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Prepare isolated CI environment
        shell: bash
        run: |
          set -euo pipefail
          cp .env.production.example .env.production
          sed -i 's/^DB_SYNC=false/DB_SYNC=true/' .env.production
          sed -i 's#^NEXT_PUBLIC_API_URL=.*#NEXT_PUBLIC_API_URL=http://127.0.0.1:4000#' .env.production
          docker network create yarsalam_network

      - name: Validate production Compose model
        run: docker compose --env-file .env.production -f docker-compose.production.yml config --quiet

      - name: Build and start isolated Admin stack
        run: docker compose --env-file .env.production -f docker-compose.production.yml up -d --build

      - name: Verify Admin web runtime
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 90); do
            code="$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:3000/login || true)"
            if [ "$code" = "200" ]; then
              echo "Admin web /login returned HTTP 200"
              exit 0
            fi
            sleep 2
          done
          docker compose --env-file .env.production -f docker-compose.production.yml logs
          exit 1

      - name: Verify initial superadmin login
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error \
            -H 'Content-Type: application/json' \
            -X POST \
            --data '{"email":"owner@example.com","password":"CHANGE_ME_at_least_16_random_characters"}' \
            http://127.0.0.1:4000/admin/auth/login)"
          node -e 'const data=JSON.parse(process.argv[1]); if(typeof data.access_token!=="string" || data.access_token.length<20) process.exit(1); console.log("Admin login returned a signed access token")' "$response"

      - name: Verify production CORS allowlist
        shell: bash
        run: |
          set -euo pipefail
          headers="$(curl --silent --show-error --include -X OPTIONS \
            -H 'Origin: https://admin.example.com' \
            -H 'Access-Control-Request-Method: POST' \
            -H 'Access-Control-Request-Headers: authorization,content-type' \
            http://127.0.0.1:4000/admin/auth/login)"
          echo "$headers" | grep -qi 'access-control-allow-origin: https://admin.example.com'

      - name: Scan Admin backend image for CRITICAL/HIGH vulnerabilities
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${RUNNER_TEMP}/trivy-cache:/root/.cache/" \
            aquasec/trivy:0.59.1 image \
            --exit-code 1 --severity CRITICAL,HIGH --ignore-unfixed \
            yarsalam-admin-backend:production

      - name: Tear down isolated stack
        if: always()
        run: docker compose --env-file .env.production -f docker-compose.production.yml down -v --remove-orphans
