name: Revenue Admin Validation

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/web/app/(admin)/exec/revenue/**"
      - "apps/web/lib/api/exec/mutations/useRevenue.ts"
      - "apps/web/components/KPICard.tsx"
      - "apps/server/src/executive/controllers/revenue.controller.ts"
      - "apps/server/src/executive/**"
      - "apps/server/src/admin/common/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".npmrc"
      - "pnpm-workspace.yaml"
      - ".github/workflows/revenue-admin-validation.yml"

permissions:
  contents: read

jobs:
  admin-revenue:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Install workspace dependencies from the current security policy
        run: pnpm install --no-frozen-lockfile
      - name: Lint changed Revenue web files
        working-directory: apps/web
        run: pnpm exec eslint --max-warnings 0 "app/(admin)/exec/revenue/page.tsx" "lib/api/exec/mutations/useRevenue.ts" "components/KPICard.tsx"
      - name: Type-check web and reject Revenue-specific errors
        shell: bash
        run: |
          set +e
          pnpm --filter web check-types > /tmp/web-typecheck.log 2>&1
          status=$?
          set -e
          cat /tmp/web-typecheck.log
          if grep -E 'exec/revenue/|lib/api/exec/mutations/useRevenue\.ts|components/KPICard\.tsx' /tmp/web-typecheck.log; then
            echo "Revenue UI type errors were found."
            exit 1
          fi
          if [ "$status" -ne 0 ]; then
            echo "::warning::The full web type-check still reports pre-existing errors outside Revenue scope; no errors were reported in the changed Revenue files."
          fi
      - name: Build admin server
        run: pnpm --filter server build
