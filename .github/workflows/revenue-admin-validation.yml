name: Revenue Admin Validation

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/web/app/(admin)/exec/revenue/**"
      - "apps/web/lib/api/exec/mutations/useRevenue.ts"
      - "apps/web/components/KPICard.tsx"
      - "apps/server/src/executive/controllers/revenue.controller.ts"
      - "apps/server/src/admin/common/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/revenue-admin-validation.yml"

permissions:
  contents: read

jobs:
  admin-revenue:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Activate pinned pnpm
        run: corepack prepare pnpm@9.0.0 --activate
      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Type-check admin web
        run: pnpm --filter web check-types
      - name: Build admin server
        run: pnpm --filter server build
